# @package _global_
# Validated template for the KORGym Wordle train/eval datasets.
defaults:
  - /eval/korgym/wordle_eval@runtime
  - _self_

exp_id: "template_korgym_wordle"

practice:
  epochs: 3
  batch_size: 20
  grpo_n: 3
  rollout_concurrency: 4
  rollout_max_retries: 2
  rollout_temperature: 0.7
  rollout_data_truncate: 100
  task_timeout: 600
  shuffle_data: true
  resume_from_hierarchy: false
  do_eval: false
  eval_strategy: "epoch"
  agent_objective: |
    input: A five-letter Wordle state with prior guesses and color feedback
    output: A valid next guess that respects all accumulated constraints
  learning_objective: |
    Extract reusable constraint tracking, information-gain, repeated-letter,
    recovery, and final-word verification strategies from complete games.
  given_ground_truth: true
  num_experiences_per_query: 1

  hierarchical_learning:
    enabled: true
    upper_pool_update_mode: clustered
    candidate_review_scope: retrieval
    clustering_enabled: true
    embedding_provider: sentence_transformer
    embedding_model_name: sentence-transformers/all-MiniLM-L6-v2
    embedding_model_revision: c9745ed1d9f207416be6d2e6f8de32d1f16199bf
    embedding_dimensions: 384
    embedding_device: cpu
    embedding_batch_size: 32
    embedding_cache_path: workspace/cache/experience_embeddings.sqlite3
    embedding_local_files_only: true
    l0_similarity_threshold: 0.60
    l1_similarity_threshold: 0.55
    l0_similarity_threshold_provisional: true
    l1_similarity_threshold_provisional: true
    allow_provisional_aggregation: false
    min_l0_per_l1: 5
    min_l1_per_l2: 3
    max_cluster_size: 20
    use_metadata_constraints: true
    hard_constraint_fields: [task_stage, failure_mode]
    soft_constraint_fields: [domain, task_family, tool_type, strategy_type]
    random_seed: 42
    aggregation_temperature: 0.0
    l0_candidate_review_enabled: true
    l1_candidate_review_enabled: true
    l2_candidate_review_enabled: true
    l0_review_temperature: 0.0
    l0_review_retrieval: semantic
    max_l0_per_problem: 0
    export_include_l0: true
    export_max_l0: null
    experience_save_path: workspace/hierarchical_experiences/template_korgym_wordle.json
    clustering_audit_path: workspace/hierarchical_experiences/template_korgym_wordle.clusters.jsonl

data:
  practice_dataset_name: "KORGym-Wordle-Train-100"

runtime:
  korgym:
    enabled: true
    game_name: "33-wordle"
    game_host: "localhost"
    game_port: 8777
    timeout_per_game: 600
    level: 5
    max_rounds: 10
