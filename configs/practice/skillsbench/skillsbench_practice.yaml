# @package _global_
defaults:
  - /eval/skillsbench/skillsbench_baseline_eval@evaluation
  - _self_

exp_id: "skillsbench_practice_2_ds"

# Training-Free GRPO settings
practice:
  epochs: 3
  batch_size: 10          # 2 tasks/batch × grpo_n=5 = 10 rollouts/batch
  grpo_n: 5              # 5 rollouts per task for richer contrast
  rollout_concurrency: 2 # keep low: each rollout launches a Docker container
  rollout_temperature: 0.7
  rollout_data_truncate: 20  # 20/10 = 2 batches/epoch, 3 epochs = 6 steps total
  task_timeout: 3600     # 1-hour outer timeout for the whole batch
  do_eval: false
  eval_strategy: "epoch"

  agent_objective: |
    input: A technical task description to be completed inside an isolated Linux environment
    output: Correct completion of the task by executing bash commands (files created, code run, etc.)

  learning_objective: |
    Help the agent improve at completing diverse technical tasks by extracting:
    - L0 (Case-level): Specific bash commands, file paths, and tool invocations that worked
    - L1 (Pattern-level): Reusable strategies for categories of tasks (data processing, file parsing, etc.)
    - L2 (Meta-level): Universal principles for systematic problem decomposition and verification

  num_experiences_per_query: 1

  # ---- Hierarchical experience learning (Path Z) ----
  # Three pools, one shared LLM merge (ADD/UPDATE/DELETE/NONE):
  #   L0 = raw per-task insights, accumulated EVERY STEP via LLM merge
  #   L1 = patterns aggregated FROM L0 at EACH EPOCH END, then merged into the L1 pool
  #   L2 = meta-principles aggregated FROM L1 at EACH EPOCH END, then merged into the L2 pool
  # Cross-epoch refinement (updating/deleting stale entries) is handled by the merge,
  # so bad early-epoch experiences get superseded rather than blindly accumulated.
  hierarchical_learning:
    enabled: true
    l1_aggregation_threshold: 5   # min NEW L0 in an epoch before aggregating an L1
    l2_aggregation_threshold: 3   # min L1 in the pool before aggregating an L2
    include_l0_in_prompt: true    # also append recent L0 cases to the agent prompt
    max_l0_recent: 40             # how many recent L0 to inject into the prompt
    experience_save_path: workspace/hierarchical_experiences/skillsbench_practice.json

# Training dataset
data:
  practice_dataset_name: "SkillsBench-Train-40"

# SkillsBench harbor settings (inherited by evaluation sub-config but can override here)
skillsbench:
  enabled: true
  inject_curated_skills: false
  task_timeout_sec: 900
  max_agent_iterations: 30
  env_build_timeout_multiplier: 3.0
  docker_cleanup_after_task: true
  docker_cleanup_builder_every_n: 10
