# @package _global_
defaults:
  - /eval/skillsbench/skillsbench_baseline_eval@evaluation
  - _self_

exp_id: "skillsbench_practice_20260830T094944Z"

# Training-Free GRPO settings
practice:
  epochs: 3
  batch_size: 10          # 2 tasks/batch × grpo_n=5 = 10 rollouts/batch
  grpo_n: 5              # 5 rollouts per task for richer contrast
  rollout_concurrency: 2 # keep low: each rollout launches a Docker container
  rollout_temperature: 0.7
  rollout_data_truncate: 20  # 20/10 = 2 batches/epoch, 3 epochs = 6 steps total
  task_timeout: 3600     # 1-hour outer timeout for the whole batch
  do_eval: false
  eval_strategy: "epoch"

  agent_objective: |
    input: A technical task description to be completed inside an isolated Linux environment
    output: Correct completion of the task by executing bash commands (files created, code run, etc.)

  learning_objective: |
    Help the agent improve at completing diverse technical tasks by extracting:
    - L0 (Case-level): Specific bash commands, file paths, and tool invocations that worked
    - L1 (Pattern-level): Reusable strategies for categories of tasks (data processing, file parsing, etc.)
    - L2 (Meta-level): Conditional cross-task strategies with explicit exclusions and actions

  num_experiences_per_query: 1

  # ---- Hierarchical experience learning ----
  # L0 is content-addressed and keeps task/rollout evidence. At each epoch end,
  # only pending parents from one metadata-compatible semantic cluster may form
  # an L1/L2. Parent status changes only after validated output is atomically saved.
  hierarchical_learning:
    enabled: true
    # Cluster-first defaults: with 20 practice tasks and one L0 candidate per
    # task, five examples provide enough repeated evidence for L1 while three
    # independent L1 patterns are required before attempting L2.
    clustering_enabled: true
    # Formal default. The package/model must be installed and cached explicitly;
    # training never downloads it implicitly.
    embedding_provider: sentence_transformer
    embedding_model_name: sentence-transformers/all-MiniLM-L6-v2
    embedding_model_revision: c9745ed1d9f207416be6d2e6f8de32d1f16199bf
    embedding_dimensions: 384
    embedding_device: cpu
    embedding_batch_size: 32
    embedding_cache_path: workspace/cache/experience_embeddings.sqlite3
    embedding_local_files_only: true
    # Provisional placeholders. Clustered aggregation remains blocked until a
    # training-only calibration report is accepted and these flags are changed.
    l0_similarity_threshold: 0.60
    l1_similarity_threshold: 0.55
    l0_similarity_threshold_provisional: true
    l1_similarity_threshold_provisional: true
    allow_provisional_aggregation: false
    min_l0_per_l1: 5
    min_l1_per_l2: 3
    max_cluster_size: 20
    use_metadata_constraints: true
    hard_constraint_fields:
      - task_stage
      - failure_mode
    soft_constraint_fields:
      - domain
      - task_family
      - tool_type
      - strategy_type
    random_seed: 42
    aggregation_temperature: 0.0
    # Raw summaries are persisted first, then reviewed serially against the
    # latest committed active L0 view. Zero disables the old per-task quota;
    # deduplication and revisions are decisions with recorded evidence.
    l0_candidate_review_enabled: true
    # Upper summaries are candidates too. They are persisted and reviewed in
    # deterministic order before they can become active L1/L2 experiences.
    l1_candidate_review_enabled: true
    l2_candidate_review_enabled: true
    l0_review_temperature: 0.0
    l0_review_full_pool_limit: 50
    l0_review_retrieval: semantic
    l0_review_top_k: 12
    l0_review_evidence_per_experience: 4
    l0_review_rollout_evidence_per_candidate: 2
    l0_review_source_ids_per_item: 32
    l0_review_content_chars: 8000
    l0_review_max_supporting_evidence_chars: 40000
    l0_review_max_attempts: 3
    max_l0_per_problem: 0
    export_include_l0: true    # include L0 in the final exported Agent prompt
    export_max_l0: 40          # final-export cap; unrelated to rollout retrieval
    experience_save_path: workspace/hierarchical_experiences/skillsbench_practice.json
    clustering_audit_path: workspace/hierarchical_experiences/skillsbench_practice.clusters.jsonl

# Training dataset
data:
  practice_dataset_name: "SkillsBench-v1.1-FamilyHoldout-SelfContained-Train"

evaluation:
  data:
    dataset: "SkillsBench-v1.1-FamilyHoldout-SelfContained-Eval"
  skillsbench:
    enabled: true
    inject_curated_skills: false
    task_timeout_sec: 900
    max_agent_iterations: 30
    env_build_timeout_multiplier: 3.0
    docker_cleanup_after_task: true
    docker_cleanup_builder_every_n: 10
    experience_condition: clustered
    train_dataset_for_overlap_check: "SkillsBench-v1.1-FamilyHoldout-SelfContained-Train"
    require_disjoint_train_eval: true
    task_split_manifest_path: configs/data/skillsbench/skillsbench_v1_1_task_splits.json
    task_split_name: family_holdout_self_contained_v1
