# @package _global_
# Validated template for DAPO-Math-17k -> AIME24 experience learning.
defaults:
  - /eval/math/math_AIME24@evaluation
  - _self_

# Change both exp_id and the two output paths before a measured run.
exp_id: "template_math_dapo_aime24"

practice:
  epochs: 2
  batch_size: 50
  grpo_n: 5
  rollout_concurrency: 8
  rollout_temperature: 0.7
  rollout_data_truncate: 100
  task_timeout: 1800
  shuffle_data: true
  do_eval: false
  eval_strategy: "epoch"
  agent_objective: |
    input: A mathematical problem from any supported area
    output: A justified step-by-step solution and a clearly marked final answer
  learning_objective: |
    Extract evidence-backed mathematical techniques, failure boundaries, and
    verification checks that can transfer to related competition problems.
  given_ground_truth: true
  num_experiences_per_query: 1

  hierarchical_learning:
    enabled: true
    # Override per experiment when a fixed language is required. Keeping the
    # template compatible avoids reinterpreting existing snapshots.
    experience_output_language: same_as_input
    clustering_enabled: true
    clustering_method: agglomerative
    embedding_provider: sentence_transformer
    embedding_model_name: sentence-transformers/all-MiniLM-L6-v2
    embedding_model_revision: c9745ed1d9f207416be6d2e6f8de32d1f16199bf
    embedding_dimensions: 384
    embedding_device: cpu
    embedding_batch_size: 32
    embedding_cache_path: workspace/cache/experience_embeddings.sqlite3
    embedding_local_files_only: true
    l0_similarity_threshold: 0.60
    l1_similarity_threshold: 0.55
    l0_similarity_threshold_provisional: true
    l1_similarity_threshold_provisional: true
    allow_provisional_aggregation: false
    min_l0_per_l1: 5
    min_l1_per_l2: 3
    max_cluster_size: 20
    use_metadata_constraints: true
    hard_constraint_fields: [task_stage, failure_mode]
    soft_constraint_fields: [domain, task_family, tool_type, strategy_type]
    random_seed: 42
    aggregation_temperature: 0.0
    l0_candidate_review_enabled: true
    l1_candidate_review_enabled: true
    l2_candidate_review_enabled: true
    l0_review_temperature: 0.0
    l0_review_retrieval: semantic
    max_l0_per_problem: 0
    l0_injection_top_k: 5
    include_l0_in_prompt: true
    max_l0_recent: 20
    experience_save_path: workspace/hierarchical_experiences/template_math_dapo_aime24.json
    clustering_audit_path: workspace/hierarchical_experiences/template_math_dapo_aime24.clusters.jsonl

data:
  practice_dataset_name: "DAPO-Math-17k"

# Training rollouts use evaluation.concurrency internally; keep this explicit
# instead of inheriting the historical 128-worker evaluation setting.
evaluation:
  concurrency: 8
