# @package _global_
# Full DAPO-100 WSL experience-learning run after the isolated smoke test.
# The namespace is new so previous runs remain available for comparison.
defaults:
  - /practice/math/math_dapo_100_full_hierarchy
  - _self_

exp_id: "math_dapo_random_100_full_hierarchy_en_v1_wsl_20260915"

practice:
  # One complete pass over the 100 frozen DAPO tasks.
  epochs: 1
  batch_size: 100
  grpo_n: 5
  rollout_concurrency: 32
  rollout_data_truncate: 100
  shuffle_data: false

  hierarchical_learning:
    # The frozen DAPO v2 questions and trajectories are Chinese. Keeping the
    # generated experience in the input language avoids failed translations on
    # long problems while preserving the language contract for review.
    experience_output_language: same_as_input
    embedding_cache_path: workspace/cache/experience_embeddings_math_dapo_random_100_full_hierarchy_en_v1_wsl_20260915.sqlite3
    experience_save_path: workspace/hierarchical_experiences/math_dapo_random_100_full_hierarchy_en_v1_wsl_20260915.json
    clustering_audit_path: workspace/hierarchical_experiences/math_dapo_random_100_full_hierarchy_en_v1_wsl_20260915.clusters.jsonl
