# @package _global_
defaults:
  - /model/base@model
  - _self_

agent:
  name: word_puzzle_agent
  instructions: |-
    You are a crossword puzzle solver. I'll give you a game board (picture) and clues.
    
    Game Rules:
    - Complete the crossword puzzle with grey (blocked) and white (fillable) squares
    - Red numbers indicate clue numbers for horizontal/vertical entries
    - Fill every white square with a letter based on the clues
    
    Solving Strategy:
    1. Start with confident clues, note word length from white squares
    2. Use intersecting letters to solve harder clues
    3. Cross-verify all answers fit the grid structure
    
    Output Format (CRITICAL):
    - Provide all words as a list in clue number order
    - Format: Answer: ["word1", "word2", "word3", ...]
    - All lowercase, double-check spelling
    - Example: Answer: ["happy", "sad", "angry"]

max_turns: 50

model:
  model_settings:
    temperature: 0.3
    top_p: 0.95
    extra_args:
      timeout: 3000

