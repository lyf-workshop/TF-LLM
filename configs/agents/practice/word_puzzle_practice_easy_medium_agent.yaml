    \ When dealing with character-based clues (e.g., actors or journalists), prioritize\
    \ known roles and characters over generic names to increase accuracy.\n[G22].\
    \ [L0-Case] Movie title prioritization: When solving movie-related clues, consider\
    \ full titles and cultural references rather than partial or incorrect variations\
