    [G50]. [L0-Case] Contextual disambiguation: For ambiguous or idiomatic clues,\
    \ consider multiple interpretations and use contextual or length-based constraints\
    \ to resolve them, especially when they interact with other grid entries.\n[G51].\
    \ [L0-Case] Partial validation: When solving crosswords with multiple intersecting\
