    \ hotel chains: For wordplay-based hotel chain clues, prioritize phonetically\
    \ similar terms that match the clue’s implied meaning and letter constraints.\n\
    [G24]. [L0-Case] Internal validation: When encountering ambiguous or invalid inputs,\
    \ the agent should first perform internal validation or consult known configurations\
    \ to reduce user back-and-forth and improve efficiency.\n[G25]. [L0-Case] Idiomatic\
    \ interpretation: When solving crossword clues involving cultural references or\
    \ wordplay, prioritize idiomatic or metaphorical interpretations over literal\
    \ ones.\n[G26]. [L0-Case] Inter-clue compatibility: Always verify candidate answers\
    \ by checking their compatibility with intersecting clues, especially when multiple\
    \ answers are uncertain.\n[G27]. [L0-Case] Error-handling pipeline: When encountering\
    \ external system failures, implement a structured error-handling workflow that\
    \ includes logging the issue, retrying with validated parameters, and offering\
    \ fallback solutions.\n[G28]. [L0-Case] Phonetic validation: When solving cryptic-style\
    \ clues involving phonetic puns or wordplay, consider multiple meanings and validate\
    \ consistency with intersecting entries.\n[G29]. [L0-Case] Phonetic clue handling:\
    \ When solving pun-based or homophonic clues, consider both the literal meaning\
    \ and phonetic similarity to identify wordplay answers.\n[G30]. [L0-Case] Compact\
    \ phrasing prioritization: When clues involve multi-word phrases or character\
    \ names, prioritize using the most standard and compact form suitable for crossword\
    \ grids (e.g., 'Borat' over longer alternatives).\n[G31]. [L0-Case] Fallback robustness:\
    \ When the expected input (e.g., generated crossword puzzle) fails to materialize,\
    \ transition immediately to a manual input mode and provide structured prompts\
    \ for users to supply clues directly.\n[G32]. [L0-Case] Idiomatic interpretation:\
    \ When solving crossword puzzles with metaphorical or idiomatic clues, prioritize\
    \ identifying the core meaning rather than a literal interpretation. For example,\
    \ 'Popped with a low blow' benefits from recognizing the phrase as a metaphor\
    \ for emotional defeat, leading to a better fit like 'deflated.'\n[G33]. [L0-Case]\
    \ Input continuity: When an external system fails to provide valid input (e.g.,\
    \ a crossword puzzle), the agent should proactively request a retry or ask for\
    \ a specific puzzle to maintain task continuity and avoid unnecessary user interaction.\n\
    [G34]. [L0-Case] Anchor-based solving: When solving crossword clues, prioritize\
    \ high-confidence answers first and use them as anchors to deduce less familiar\
    \ ones by leveraging intersecting letters and shared patterns.\n[G35]. [L0-Case]\
    \ Validation refinement: Incorporate a step-by-step validation mechanism—such\
    \ as checking letter overlaps or using external knowledge tools—to systematically\
    \ verify and refine guesses when uncertainty arises.\n[G36]. [L0-Case] Quote validation:\
    \ For ambiguous or culturally specific clues involving quotes, validate the speaker\
    \ or source using external references to avoid misattribution.\n[G37]. [L0-Case]\
    \ Intersecting validation: When solving ambiguous or idiomatic clues, prioritize\
    \ validating the answer against intersecting entries to ensure consistency and\
    \ reduce errors caused by isolated guesswork.\n[G38]. [L0-Case] Cultural clue\
    \ validation: When encountering culturally or linguistically rich clues (e.g.,\
    \ song titles, book characters), leverage pre-existing knowledge but always confirm\
    \ it fits both the clue definition and the spatial constraints of the crossword\
    \ grid.\n[G39]. [L0-Case] Internal fallback: When external game environments fail,\
    \ activate internal puzzle templates or rules-based solvers to maintain task continuity.\n\
    [G40]. [L0-Case] Plausible simulation: When input is ambiguous or unresolvable,\
    \ simulate a plausible version of the task using known patterns before seeking\
    \ user clarification.\n[G41]. [L0-Case] Definition first: When solving cryptic-style\
    \ clues with indicators like '*', prioritize identifying the definition part before\
    \ attempting wordplay to anchor the solution and reduce guesswork.\n[G42]. [L0-Case]\
    \ Brand verification: For brand/product-related clues, prioritize well-known names\
    \ and verify against known product lines to avoid mispronunciations or misspellings\
    \ (e.g., 'wham-o' instead of 'whamola').\n[G43]. [L0-Case] Cryptic interpretation:\
    \ When solving cryptic or multi-layered clues, prioritize identifying double definitions,\
    \ hidden words, or wordplay before defaulting to direct interpretations.\n[G44].\
    \ [L0-Case] Recovery protocol: When encountering unresolvable or incomplete inputs,\
    \ implement a structured recovery protocol with retries, alternatives, or clarification\
    \ queries instead of generic error messages.\n[G45]. [L0-Case] Concise phrase\
    \ handling: When a clue appears to be a phrase or sentence, prioritize finding\
