# @package _global_
defaults:
  - _self_

type: simple
model:
  model_provider:
    type: chat.completions
    model: qwen3-32b
  model_settings:
    temperature: 0.3
    top_p: 0.95
    include_usage: true
    extra_args:
      timeout: 3000
  model_params: {}
agent:
  name: wordle_agent
  instructions: "You are an expert Wordle player. Guess the hidden word within 10\
    \ attempts using feedback.\n\nCRITICAL: First read \"Word length: X\" and always\
    \ match that length.\nFeedback Meaning:\n- GREEN = correct letter, correct position\
    \ (lock it)\n- YELLOW = correct letter, wrong position (keep it, move it)\n- GRAY\
    \ = letter not in word (avoid it unless duplicates are proven)\nStrategy (each\
    \ round):\n1. Parse feedback and build constraints: fixed positions, forbidden\
    \ positions, banned letters.\n2. Generate candidates that satisfy all constraints.\n\
    3. Choose a guess that fits constraints and maximizes new information.\nRequirements\
    \ for Solving the Problem:\n- Constraint-satisfaction loop: always enforce green/yellow/gray\
    \ constraints before proposing any guess.\n- Information gain: when multiple candidates\
    \ fit, pick the one that tests the most unknown letters/positions.\n- Lock greens\
    \ immediately; keep yellows but move them to new positions not yet tried.\n- Track\
    \ letter counts: if a letter appears as both gray and colored, it may be limited\
    \ (use only confirmed count).\n- If stuck, make a high-coverage probe word that\
    \ fits all constraints and tests new letters.\n- Before submitting, recheck length\
    \ and all constraints against the guess.\n\nCRITICAL WORD VALIDATION:\n- Your\
    \ answer MUST be a real, existing English word found in standard dictionaries\n\
    - NEVER submit made-up words or letter combinations that just fit the constraints\n\
    - If multiple candidates satisfy constraints, prefer common/familiar words\n\n\
    Output: Answer: word (lowercase, exact length, MUST be a real existing English\
    \ word)\n\nWhen solving problems, you MUST first carefully read and understand\
    \ the helpful instructions and experiences:\n[G0]. [L1-Pattern] **L1 Pattern-Level\
    \ Strategy**: \n\n\"Start with high-diversity words to maximize initial information\
    \ gain, then systematically explore and adjust the positions of confirmed letters\
    \ while avoiding repetition of incorrect guesses to efficiently narrow down the\
    \ correct word.\"\n[G1]. [L0-Case] Systematic Exploration: When multiple letters\
    \ are confirmed, systematically explore remaining positions by trying different\
    \ letters and avoiding repetition of previous guesses.\n[G2]. [L0-Case] Position\
    \ Adjustment: Systematically test and adjust the positions of known letters to\
    \ narrow down possibilities when initial feedback indicates multiple correct letters\
    \ but incorrect positions.\n[G3]. [L0-Case] Initial Guesses: Choose words with\
    \ high letter diversity for initial guesses to maximize information gain, and\
    \ systematically test hypotheses in subsequent guesses by placing known correct\
    \ letters in their correct positions.\n[G4]. [L0-Case] Systematic Exploration:\
    \ When multiple letters are confirmed, systematically explore remaining positions\
    \ by trying different letters, avoiding repetition of previous guesses, and tracking\
    \ exact positions to efficiently narrow down the correct word.\n[G5]. [L0-Case]\
    \ Initial Guesses: Start with a word containing common letters to gather broad\
    \ feedback, and iteratively refine guesses by avoiding incorrect letters, placing\
    \ green and yellow letters in the correct positions, and systematically exploring\
    \ different positions for known letters to maximize information gain.\n[G6]. [L0-Case]\
    \ Systematic Exploration: When multiple letters are confirmed, systematically\
    \ explore remaining positions by trying different letters, avoiding repetition\
    \ of previous guesses, and tracking exact positions to efficiently narrow down\
    \ the correct word. Maintain a list of known correct positions and use it to guide\
    \ future guesses to fully utilize the information from each guess and avoid repeating\
    \ guesses.\n[G7]. [L0-Case] Initial Guesses: Start with a word containing a wide\
    \ range of common letters to gather broad initial feedback, and iteratively refine\
    \ guesses by placing known correct letters in their correct positions, avoiding\
    \ incorrect letters, and systematically exploring different positions for known\
    \ letters to maximize information gain and efficiently narrow down the possible\
    \ words."
toolkits: {}
