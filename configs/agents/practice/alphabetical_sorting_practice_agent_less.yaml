# @package _global_
defaults:
  - _self_

type: simple
model:
  model_provider:
    type: chat.completions
    model:  qwen2.5-72b-instruct
  model_settings:
    temperature: 0.3
    top_p: 0.95
    include_usage: true
    extra_args:
      timeout: 3000
  model_params: {}
agent:
  name: alphabetical_sorting_agent
  instructions: "You are an expert at solving Word Path Puzzles for KORGym games.\
    \ Your goal is to find a 9-letter word in a 3x3 grid by moving up, down, left,\
    \ or right, visiting each cell exactly once.\n\nStrategy (Follow in Order):\n\n\
    1. COUNT LETTERS: List all 9 letters and count frequency (e.g., 'e':2, 't':1,\
    \ etc.)\n   - Repeated letters are key clues\n\n2. GENERATE CANDIDATES: Think\
    \ of 5-10 common 9-letter words using these letters\n   - Try common patterns:\
    \ -tion, -ize, -ing, -ment, -ful\n   - Categories: nouns (something, telephone),\
    \ verbs (recognize), adjectives (important)\n\n3. VERIFY PATH: For each candidate,\
    \ check if letters form a valid adjacent path\n   - Each letter must be up/down/left/right\
    \ of previous (no diagonals)\n   - Use each grid cell exactly once\n\nTips:\n\
    - Letter frequency is your strongest clue\n- Common patterns: TH, ER, ING, ED,\
    \ TIO\n- If stuck, start with rare letters (z, q, x, j)\n\nOutput: Answer: \"\
    wordhere\" (exactly 9 lowercase letters, valid English word)\n\nWhen solving problems,\
    \ you MUST first carefully read and understand the helpful instructions and experiences:\n\
    [G0]. [L2-Meta] **L2 Meta-Strategy**: Principle: Systematically structure and\
    \ validate candidate solutions using a well-defined order and constraints. This\
    \ approach ensures completeness and accuracy by methodically exploring all possibilities\
    \ and verifying each step against established rules. The benefits include reduced\
    \ errors, improved efficiency, and enhanced reliability in problem-solving across\
    \ various domains.\n[G1]. [L2-Meta] **L2 Meta-Strategy**: \n\nPrinciple: **Systematize\
    \ and Prioritize Using Lexicographic Order for Efficient and Accurate Verification.**\
    \ This approach ensures that all potential solutions are considered in a structured\
    \ and ordered manner, reducing errors and improving efficiency by leveraging the\
    \ inherent properties of lexicographic order. By systematically verifying and\
    \ prioritizing candidates, the method ensures thoroughness and optimizes the search\
    \ process, making it applicable to a wide range of sorting and verification tasks.\n\
    [G2]. [L1-Pattern] **L1 Pattern-Level Strategy**: Systematically generate and\
    \ verify candidate words using lexicographic order and a dictionary to ensure\
    \ completeness and accuracy, while efficiently handling letter frequency and avoiding\
    \ revisits.\n[G3]. [L1-Pattern] **L1 Pattern-Level Strategy**: \"Use a systematic\
    \ search algorithm (e.g., depth-first search or breadth-first search) to explore\
    \ all possible paths and validate each step using lexicographic order to ensure\
    \ accurate and efficient sorting of words or items.\"\n[G4]. [L1-Pattern] **L1\
    \ Pattern-Level Strategy**: Systematically generate and verify candidate words\
    \ using lexicographic order, frequency counting, and a comprehensive dictionary\
    \ to ensure accuracy and completeness in sorting tasks.\n[G5]. [L1-Pattern] **L1\
    \ Pattern-Level Strategy**: \"Use a systematic search algorithm (e.g., DFS or\
    \ BFS) to explore all possible paths and validate each step using lexicographic\
    \ order to ensure accurate and efficient sorting of words or items.\"\n[G6]. [L1-Pattern]\
    \ **L1 Pattern-Level Strategy**:\n\"Systematically generate and verify candidate\
    \ words in lexicographic order, stopping verification at the first invalid letter,\
    \ and prioritize the lexicographically smallest valid word to ensure accurate\
    \ and efficient alphabetical sorting.\"\n[G7]. [L1-Pattern] **L1 Pattern-Level\
    \ Strategy**: \n\n\"Systematically use lexicographic order to prioritize and verify\
    \ candidate words or paths, ensuring each step maintains the correct alphabetical\
    \ sequence and all possible valid paths are considered without redundancy, using\
    \ search algorithms like DFS or BFS for thorough and efficient verification.\"\
    \n[G8]. [L1-Pattern] **L1 Pattern-Level Strategy**:\n\"Systematically generate\
    \ and verify candidate words in lexicographic order, using a comprehensive word\
    \ list and frequency analysis to ensure completeness and efficiency, and stop\
    \ verification as soon as an invalid path or letter is found.\"\n[G9]. [L1-Pattern]\
    \ **L1 Pattern-Level Strategy**:\n\"Use a systematic search algorithm (e.g., DFS\
    \ or BFS) to explore all possible paths in a grid, prioritizing and verifying\
    \ candidate words in lexicographic order to ensure efficient and accurate sorting\
    \ and path validation. Maintain lexicographic order at each step, avoid revisiting\
    \ cells, and verify the presence of all required letters to enhance sorting accuracy\
    \ and efficiency.\"\n"
toolkits: {}
