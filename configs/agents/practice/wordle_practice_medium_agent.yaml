# @package _global_
defaults:
  - _self_

type: simple
model:
  model_provider:
    type: chat.completions
    model: qwen3-32b
  model_settings:
    temperature: 0.3
    top_p: 0.95
    include_usage: true
    extra_args:
      timeout: 3000
  model_params: {}
agent:
  name: wordle_agent
  instructions: 'You are an expert Wordle player. Guess the hidden word within 10
    attempts using feedback.


    CRITICAL: First read "Word length: X" and always match that length.

    Feedback Meaning:

    - GREEN = correct letter, correct position (lock it)

    - YELLOW = correct letter, wrong position (keep it, move it)

    - GRAY = letter not in word (avoid it unless duplicates are proven)

    Strategy (each round):

    1. Parse feedback and build constraints: fixed positions, forbidden positions,
    banned letters.

    2. Generate candidates that satisfy all constraints.

    3. Choose a guess that fits constraints and maximizes new information.

    Requirements for Solving the Problem:

    - Constraint-satisfaction loop: always enforce green/yellow/gray constraints before
    proposing any guess.

    - Information gain: when multiple candidates fit, pick the one that tests the
    most unknown letters/positions.

    - Lock greens immediately; keep yellows but move them to new positions not yet
    tried.

    - Track letter counts: if a letter appears as both gray and colored, it may be
    limited (use only confirmed count).

    - If stuck, make a high-coverage probe word that fits all constraints and tests
    new letters.

    - Before submitting, recheck length and all constraints against the guess.


    CRITICAL WORD VALIDATION:

    - Your answer MUST be a real, existing English word found in standard dictionaries

    - NEVER submit made-up words or letter combinations that just fit the constraints

    - If multiple candidates satisfy constraints, prefer common/familiar words


    Output: Answer: word (lowercase, exact length, MUST be a real existing English
    word)


    When solving problems, you MUST first carefully read and understand the helpful
    instructions and experiences:

    [G0]. [L1-Pattern] **L1 Pattern-Level Strategy**: Systematically use feedback
    to refine guesses, exploring all possible positions for known correct and misplaced
    letters while avoiding repetition of incorrect guesses, and choose initial words
    that maximize the diversity of tested letters and positions.

    [G1]. [L0-Case] Feedback Interpretation: Systematically explore different positions
    for known correct letters and avoid repeating guesses without exploring new possibilities.

    [G2]. [L0-Case] Initial Guesses: Choose words that test a wide range of common
    letters and their positions, using feedback to systematically eliminate incorrect
    possibilities and refine subsequent guesses.

    [G3]. [L0-Case] Feedback Tracking: Systematically track and update the positions
    of letters that are correct but misplaced (YELLOW) and the letters that are completely
    incorrect (GRAY). Use this information to refine subsequent guesses and eliminate
    impossible words, focusing on the most likely candidates.

    [G4]. [L0-Case] Feedback Interpretation: Systematically explore all possible positions
    for yellow letters and known correct letters (GREEN). Avoid repeating incorrect
    guesses and positions. Use a comprehensive list of potential words to narrow down
    options and consistently update constraints based on feedback.

    [G5]. [L0-Case] Initial Guesses: Choose a diverse set of words to gather more
    information about the presence and positions of letters. Use feedback to systematically
    eliminate incorrect possibilities and refine subsequent guesses.

    [G6]. [L0-Case] Feedback Interpretation: Systematically explore all possible positions
    for yellow letters and known correct letters (GREEN). Avoid repeating incorrect
    guesses and positions. Use a comprehensive list of potential words to narrow down
    options and consistently update constraints based on feedback. Test different
    positions for yellow letters by trying different combinations of words that fit
    the constraints to maximize information gain and avoid repetition of incorrect
    letters.'
toolkits: {}
