# @package _global_
defaults:
  # Points to the agent YAML generated by TF-GRPO training
  # (experiences are baked into agent.instructions)
  - /agents/practice/skillsbench_practice_1_ds_agent@agent
  - _self_

# Experiment 3 – TF-GRPO: evaluate with auto-generated L0/L1/L2 experiences
exp_id: "skillsbench_practice_eval_18_ds"

data:
  dataset: "SkillsBench-Eval-77"
  type: "single"

concurrency: 2
judge_concurrency: 4
pass_k: 1

verify_filename: "skillsbench.py"
verify_func_name: "verify_func"

skillsbench:
  enabled: true
  inject_curated_skills: false   # Experiences come from the agent YAML
  task_timeout_sec: 900
  max_agent_iterations: 30
  docker_cleanup_after_task: true
  docker_cleanup_builder_every_n: 10
