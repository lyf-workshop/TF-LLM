# @package _global_
defaults:
  - /agents/practice/skillsbench_agent@agent
  - _self_

# Experiment 1 – Baseline: no Skills, no experiences
exp_id: "skillsbench_baseline_eval_8_ds"

data:
  dataset: "SkillsBench-Eval-77"
  type: "single"

# Each task launches a Docker container; keep concurrency low to avoid
# saturating the event loop and Docker daemon simultaneously.
concurrency: 2
judge_concurrency: 4
pass_k: 1

# verify function (reads harbor reward if present, falls back to LLM)
verify_filename: "skillsbench.py"
verify_func_name: "verify_func"

# SkillsBench harbor execution settings
skillsbench:
  enabled: true
  inject_curated_skills: false   # Exp 1: no Skills injected
  task_timeout_sec: 900
  max_agent_iterations: 30
  docker_cleanup_after_task: true
  docker_cleanup_builder_every_n: 10
