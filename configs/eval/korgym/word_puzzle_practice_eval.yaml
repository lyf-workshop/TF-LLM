# @package _global_
defaults:
  - /agents/practice/word_puzzle_practice_easy_medium_hard_agent@agent
  - _self_

exp_id: "word_puzzle_practice_eval_easy_medium_hard_3"

# Evaluation dataset configuration (same as baseline)
data:
  dataset: "KORGym-WordPuzzle-Eval-50"
  type: "single"

# Evaluation settings
concurrency: 16
pass_k: 1

# Verification function settings
verify_filename: "korgym.py"
verify_func_name: "verify_func"

# KORGym specific settings
korgym:
  enabled: true  # ✅ 启用 KORGym
  game_name: "8-word_puzzle"
  game_host: "localhost"
  game_port: 8775
  level: 1  # ✅ 添加level参数
  max_rounds: 1
  timeout_per_game: 600

# ===== LLM-Based Experience Filtering Configuration =====
# This configuration demonstrates the new LLM reranking feature for intelligent experience selection
experience_filter:
  enabled: false
  strategy: "llm_rerank"  # Use LLM-based reranking (static | retrieval | llm_rerank)
  
  # External experience source (load from hierarchical experience JSON)
  experience_source: "workspace/hierarchical_experiences/word_puzzle_practice.json"
  
  # Two-stage filtering: Recall + Rerank
  
  # Stage 1: Recall candidates
  recall:
    method: "static"  # static | bm25 | all
    max_l2: null      # Include all L2 (meta-strategy) experiences
    max_l1: null      # Include all L1 (pattern-level) experiences
    max_l0: 30        # Limit L0 (case-level) to 30 to reduce noise
  
  # Stage 2: LLM reranking
  llm_rerank:
    enabled: true
    model: "qwen3-32b"           # LLM model for reranking
    temperature: 0.1              # Low temperature for stable scoring
    max_candidates: 20            # Maximum experiences to evaluate with LLM
    final_top_k: 14                # Final number of experiences to inject into agent
    include_reasoning: true       # Log LLM reasoning for scores
    scoring_criteria:             # Evaluation criteria
      - "relevance"               # How relevant to current task
      - "generalization"          # How broadly applicable
      - "actionability"           # How directly usable
    timeout: 60                   # API timeout in seconds
