# @package _global_
defaults:
  - /agents/practice/alphabetical_sorting_practice_agent@agent
  - _self_

exp_id: "alphabetical_sorting_practice_eval_8"

# Evaluation dataset configuration (same as baseline)
data:
  dataset: "KORGym-AlphabeticalSorting-Eval-50"
  type: "single"

# Evaluation settings
concurrency: 32
pass_k: 1

# Verification function settings
verify_filename: "korgym.py"
verify_func_name: "verify_func"

# KORGym specific settings
korgym:
  enabled: true
  game_name: "22-alphabetical_sorting"
  game_host: "localhost"
  game_port: 8776
  level: 3
  max_rounds: 1
  timeout_per_game: 300

experience_filter:
  enabled: true              # 启用经验筛选
  strategy: "static"         # 使用静态筛选策略
  max_l2: 2                 # 最多保留 3 条 L2（元策略）
  max_l1: 4                 # 最多保留 5 条 L1（模式级）
  max_l0: 6                 # 不保留 L0（案例级）
  # 以下为动态检索配置（未来扩展）
  retrieval_top_k: 5
  retrieval_min_score: 0.0