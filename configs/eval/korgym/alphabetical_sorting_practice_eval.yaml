# @package _global_
defaults:
  - /agents/practice/alphabetical_sorting_practice_agent_less@agent  # ✅ 使用基础 agent（无经验）
  - _self_

# ⚠️ IMPORTANT: 使用关键词检索时，必须用不含经验的基础 agent
# 经验会从 JSON 文件加载并通过 TF-IDF 检索筛选后注入

exp_id: "alphabetical_sorting_practice_eval_retrieval_16"

# Evaluation dataset configuration (same as baseline)
data:
  dataset: "KORGym-AlphabeticalSorting-Eval-50"

# Evaluation settings
concurrency: 24
pass_k: 1

# KORGym specific settings
korgym:
  enabled: true
  game_name: "22-alphabetical_sorting"
  game_host: "localhost"
  game_port: 8776
  level: 3  # 排序难度等级
  max_rounds: 1  # 单轮游戏
  timeout_per_game: 300

# ===== TF-IDF 经验筛选配置 =====
experience_filter:
  enabled: true 
  # 📌 作用：启用经验筛选功能
  
  strategy: "retrieval"  
  # 📌 作用：使用 TF-IDF 关键词检索策略（static | retrieval | llm_rerank）
  # - static: 按层级数量截断（不看内容）
  # - retrieval: 按关键词相关性检索（本配置使用的）
  # - llm_rerank: 用 LLM 智能重排（需要 API 成本）
  
  experience_source: "workspace/hierarchical_experiences/alphabetical_sorting_practice_less.json"
  # 📌 作用：指定从哪个 JSON 文件加载经验库
  # 这个文件是训练阶段生成的，包含 L0/L1/L2 三层经验
  
  retrieval_top_k: 8
  # 📌 作用：TF-IDF 检索返回多少条最相关的经验
  # 值越大，注入的经验越多（但可能引入噪声）
  # 推荐：5-10 条
  
  retrieval_min_score: 0.0
  # 📌 作用：TF-IDF 评分的最低阈值，低于此分数的经验会被过滤
  # 0.0 表示不设阈值，只按 top_k 选取
  # 可以设置如 0.5 来过滤掉相关性太低的经验
