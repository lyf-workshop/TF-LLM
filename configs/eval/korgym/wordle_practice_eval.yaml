# @package _global_
defaults:
  - /agents/practice/wordle_practice_agent@agent
  - _self_

exp_id: "wordle_practice_eval"

# Evaluation dataset configuration (same as baseline)
data:
  dataset: "KORGym-Wordle-Eval-50"
  type: "single"

# Evaluation settings
concurrency: 2
pass_k: 1

# Verification function settings
verify_filename: "korgym.py"
verify_func_name: "verify_func"

# KORGym specific settings
korgym:
  enabled: true
  game_name: "33-wordle"
  game_host: "localhost"
  game_port: 8777
  level: 4  # 单词长度（4-12，推荐5）
  max_rounds: 10  # ✅ 与游戏代码一致（第113行 attempts=10）
  timeout_per_game: 600

# Experience filtering configuration (NEW!)
experience_filter:
  enabled: true              # 启用经验筛选
  strategy: "static"         # 使用静态筛选策略
  max_l2: 2                 # 最多保留 3 条 L2（元策略）
  max_l1: 3                 # 最多保留 5 条 L1（模式级）
  max_l0: 0                 # 不保留 L0（案例级）
  # 以下为动态检索配置（未来扩展）
  retrieval_top_k: 5
  retrieval_min_score: 0.0