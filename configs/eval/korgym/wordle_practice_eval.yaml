# @package _global_
defaults:
  - /agents/practice/wordle_practice_easy_agent@agent
  - _self_

exp_id: "wordle_practice_eval_medium_4"

# Evaluation dataset configuration (same as baseline)
data:
  dataset: "KORGym-Wordle-Eval-50"

# Evaluation settings
concurrency: 6
pass_k: 1

# KORGym specific settings
korgym:
  enabled: true
  game_name: "33-wordle"
  game_host: "localhost"
  game_port: 8777
  level: 4  # 单词长度（4-12，推荐5）
  max_rounds: 10  # ✅ 与游戏代码一致（第113行 attempts=10）
  timeout_per_game: 600
