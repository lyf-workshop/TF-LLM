# @package _global_
defaults :
  - /agents/practice/wordle_practice_easy_agent@agent  # ✅ Use base agent WITHOUT experiences
  - _self_

# ⚠️ IMPORTANT: Use base wordle_agent (no experiences) when experience_filter is enabled
# The experiences will be loaded from JSON and filtered by LLM

exp_id: "wordle_practice_eval_20_54"

# Evaluation dataset configuration (same as baseline)
data:
  dataset: "KORGym-Wordle-Eval-50"

# Evaluation settings
concurrency: 6 # ⚠️ 多轮游戏必须用低并发（2-4），避免 API 限流和 502 错误
pass_k: 1

# KORGym specific settings
korgym:
  enabled: true
  game_name: "33-wordle"
  game_host: "localhost"
  game_port: 8777
  level: 5  # 单词长度（4-12，推荐5）
  max_rounds: 10  # ✅ 与游戏代码一致（第113行 attempts=10）
  timeout_per_game: 600

