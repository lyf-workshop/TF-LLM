# @package _global_
defaults :
  - /agents/practice/wordle_practice_20_l4_agent@agent  # ✅ Use base agent WITHOUT experiences
  - _self_

# ⚠️ IMPORTANT: Use base wordle_agent (no experiences) when experience_filter is enabled
# The experiences will be loaded from JSON and filtered by LLM

exp_id: "wordle_practice_eval_llm_14"

# Evaluation dataset configuration (same as baseline)
data:
  dataset: "KORGym-Wordle-Eval-50"
  type: "single"

# Evaluation settings
concurrency: 6 # ⚠️ 多轮游戏必须用低并发（2-4），避免 API 限流和 502 错误
pass_k: 1

# Verification function settings
verify_filename: "korgym.py"
verify_func_name: "verify_func"

# KORGym specific settings
korgym:
  enabled: true
  game_name: "33-wordle"
  game_host: "localhost"
  game_port: 8777
  level: 5  # 单词长度（4-12，推荐5）
  max_rounds: 10  # ✅ 与游戏代码一致（第113行 attempts=10）
  timeout_per_game: 600

# ===== LLM-Based Experience Filtering Configuration =====
# This configuration demonstrates the new LLM reranking feature for intelligent experience selection
# ===== 关键词检索（BM25）经验筛选配置 =====
experience_filter:
  enabled: true 
  # 📌 作用：启用经验筛选功能
  
  strategy: "retrieval"  
  # 📌 作用：使用 BM25 关键词检索策略（static | retrieval | llm_rerank）
  # - static: 按层级数量截断（不看内容）
  # - retrieval: 按关键词相关性检索（本配置使用的）
  # - llm_rerank: 用 LLM 智能重排（需要 API 成本）
  
  experience_source: "workspace/hierarchical_experiences/wordle_practice_2_less.json"
  # 📌 作用：指定从哪个 JSON 文件加载经验库
  # 这个文件是训练阶段生成的，包含 L0/L1/L2 三层经验
  
  retrieval_top_k: 2
  # 📌 作用：BM25 检索返回多少条最相关的经验
  # 值越大，注入的经验越多（但可能引入噪声）
  # 推荐：5-10 条
  
  retrieval_min_score: 0.0
  # 📌 作用：BM25 评分的最低阈值，低于此分数的经验会被过滤
  # 0.0 表示不设阈值，只按 top_k 选取
  # 可以设置如 0.5 来过滤掉相关性太低的经验
  
  # ===== 以下是 legacy 参数（retrieval 策略下不使用）=====
  max_l2: null  # 仅在 static 策略下生效
  max_l1: null  # 仅在 static 策略下生效
  max_l0: null  # 仅在 static 策略下生效                 # API timeout in seconds



