# @package _global_
defaults:
  - /agents/practice/wordle_practice_20_l4_agent@agent
  - _self_

# Use a clean base agent; experiences are loaded from the snapshot below.
exp_id: "wordle_practice_eval_llm_14"

data:
  dataset: "KORGym-Wordle-Eval-50"

concurrency: 6
pass_k: 1

korgym:
  enabled: true
  game_name: "33-wordle"
  game_host: "localhost"
  game_port: 8777
  level: 5
  max_rounds: 10
  timeout_per_game: 600

experience_filter:
  enabled: true
  strategy: "retrieval"
  experience_source: "workspace/hierarchical_experiences/wordle_practice_2_less.json"
  retrieval_top_k: 2
  retrieval_min_score: 0.0
