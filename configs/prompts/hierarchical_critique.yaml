# Structured prompts for within-cluster hierarchical aggregation.

L1_AGGREGATION_PROMPT:
  system: |
    You distill a set of semantically related, case-level experiences into ONE
    operational pattern. The input has already been clustered. Use only common,
    evidence-backed behavior in this cluster.

    Agent objective: {{ agent_objective }}
    Learning objective: {{ learning_objective }}

    Do not concatenate or paraphrase every item. Do not hide contradictions with
    vague advice such as "plan carefully" or "verify results". The principle must
    name a concrete trigger and an executable technique. State when the pattern
    should not be used.

    If the experiences do not support one reliable common pattern, return exactly:
    {"decision":"conflict","conflict_reasons":["<specific conflict or missing evidence>"]}

    Otherwise return only one JSON object with exactly these fields:
    {
      "decision": "aggregate",
      "title": "distinctive pattern name",
      "principle": "specific reusable rule grounded in this cluster",
      "applicable_when": ["observable trigger"],
      "not_applicable_when": ["observable exclusion or conflicting condition"],
      "recommended_actions": ["ordered, executable action"],
      "evidence_summary": "how the supplied cases jointly support the rule",
      "confidence": 0.0
    }
    confidence must be between 0 and 1. Do not include Markdown fences or prose.

  user: |
    Clustered L0 evidence:
    {% for exp in l0_experiences %}
    - id={{ exp.id }}
      content={{ exp.content }}
      domain={{ exp.domain }}; task_family={{ exp.task_family }};
      failure_mode={{ exp.failure_mode }}; strategy_type={{ exp.strategy_type }};
      tool_type={{ exp.tool_type }}; task_stage={{ exp.task_stage }}
    {% endfor %}

    Produce one validated L1 pattern shared by this cluster, or explicitly report
    that reliable aggregation is impossible.

L2_AGGREGATION_PROMPT:
  system: |
    You distill a set of semantically related L1 patterns into ONE higher-level
    strategy. The result must remain conditional and executable rather than a
    universal slogan.

    Agent objective: {{ agent_objective }}
    Learning objective: {{ learning_objective }}

    Use only principles supported by the supplied L1 parents and their exact L0
    evidence. Explain applicability, exclusions, and concrete actions. Never
    invent evidence and never reconcile genuine conflicts with vague compromise.

    If the L1 patterns do not support one reliable higher-level strategy, return:
    {"decision":"conflict","conflict_reasons":["<specific conflict or missing evidence>"]}

    Otherwise return only one JSON object with exactly these fields:
    {
      "decision": "aggregate",
      "title": "distinctive meta-strategy name",
      "principle": "conditional cross-pattern rule",
      "applicable_when": ["observable trigger"],
      "not_applicable_when": ["observable exclusion or conflicting condition"],
      "recommended_actions": ["ordered, executable action"],
      "evidence_summary": "which parent patterns and cases support the rule",
      "confidence": 0.0
    }
    confidence must be between 0 and 1. Do not include Markdown fences or prose.

  user: |
    Clustered L1 parents:
    {% for exp in l1_experiences %}
    - id={{ exp.id }}
      content={{ exp.content }}
      direct_source_l0_ids={{ exp.source_l0_ids|join(', ') }}
      domain={{ exp.domain }}; task_family={{ exp.task_family }};
      failure_mode={{ exp.failure_mode }}; strategy_type={{ exp.strategy_type }};
      tool_type={{ exp.tool_type }}; task_stage={{ exp.task_stage }}
    {% endfor %}

    Exact L0 evidence reachable from those L1 parents:
    {% for exp in l0_experiences %}
    - [{{ exp.id }}] {{ exp.content }}
    {% endfor %}

    Produce one validated L2 strategy shared by these parents, or explicitly
    report that reliable aggregation is impossible.
