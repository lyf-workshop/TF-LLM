site_name: TF-LLM
site_description: Training-Free GRPO 与经验驱动 Agent 研究项目
repo_name: lyf-workshop/TF-LLM
repo_url: https://github.com/lyf-workshop/TF-LLM

theme:
  name: material
  language: zh

nav:
  - 首页: index.md
  - 项目:
      - 当前状态: PROJECT_STATUS.md
      - 项目架构: PROJECT_ARCHITECTURE.md
      - 部署指南: DEPLOYMENT.md
      - 故障排查: TROUBLESHOOTING.md
  - 数据集:
      - 总览: datasets/index.md
      - SkillsBench: datasets/skillsbench.md
      - LiveCodeBench: datasets/livecodebench.md
      - AIME: datasets/aime.md
      - WebWalkerQA: datasets/webwalkerqa.md
      - ZebraLogic: datasets/zebralogic.md
      - KORGym 总览: datasets/korgym.md
      - KORGym Word Puzzle: datasets/korgym-word-puzzle.md
      - KORGym Alphabetical Sorting: datasets/korgym-alphabetical-sorting.md
      - KORGym Wordle: datasets/korgym-wordle.md
  - 方法:
      - Training-Free GRPO: concepts/training_free_grpo.md
      - 分层经验: concepts/hierarchical_experience.md
      - 经验选择: concepts/experience_selection.md
      - 误差分析: concepts/error_analysis.md
  - 研究提案:
      - 总览: research/index.md
      - Self-Evolving Agent: research/self_evolving_agent_design.md
      - Self-Play: research/self_play_design.md
  - 参考:
      - 配置: reference/configuration.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css
